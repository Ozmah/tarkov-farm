name: Submit a contribution bundle
description: Send one ZIP created by the experimental contribution editor.
title: "[Contribution bundle] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for preparing a Tarkov Farm contribution bundle.

        Attach the ZIP downloaded from the editor below. GitHub attachments are public and limited to 25 MiB. For a larger bundle, upload it privately elsewhere and paste the sharing link instead.

  - type: textarea
    id: bundle
    attributes:
      label: Contribution ZIP or private download link
      description: Drag the ZIP generated by Tarkov Farm into this field, or paste a private sharing link when the ZIP exceeds GitHub's limit.
      placeholder: Drag the ZIP here or paste its private download link.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add anything the reviewer should know about these locations.
      placeholder: Optional context for the reviewer.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I generated this ZIP with the Tarkov Farm contribution editor.
          required: true
        - label: I checked Tarkov Farm and the open issues for duplicates.
          required: true
        - label: The documents are visible in screenshots I captured myself.
          required: true
        - label: I understand that a ZIP attached directly to GitHub is public.
          required: true

name: Submit a contribution bundle
description: Send one ZIP created by the experimental contribution editor.
title: "[Contribution bundle] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for preparing a Tarkov Farm contribution bundle.

        Attach the ZIP downloaded from the editor below. GitHub attachments are public and limited to 25 MiB. If the ZIP is larger, do not submit it here; contact the maintainer through your existing private channel to arrange the transfer. Never paste private download links into this public issue.

  - type: textarea
    id: bundle
    attributes:
      label: Contribution ZIP
      description: Drag one ZIP generated by Tarkov Farm into this field. Download links are not accepted.
      placeholder: Drag the ZIP here.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add anything the reviewer should know about these locations.
      placeholder: Optional context for the reviewer.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I generated this ZIP with the Tarkov Farm contribution editor.
          required: true
        - label: I checked Tarkov Farm and the open issues for duplicates.
          required: true
        - label: The documents are visible in screenshots I captured myself.
          required: true
        - label: I understand that a ZIP attached directly to GitHub is public.
          required: true
